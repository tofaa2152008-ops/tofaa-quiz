<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المتصدرين - Tofaa Quiz</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            rgba(124, 58, 237, 0.18),
            transparent 35%
        ),
        #0F172A;

    color: #F8FAFC;

    min-height: 100vh;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}


/* =========================================
   HEADER
========================================= */

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    padding: 17px 7%;

    background:
        rgba(15, 23, 42, 0.88);

    border-bottom:
        1px solid rgba(255, 255, 255, 0.06);

    backdrop-filter: blur(16px);

    -webkit-backdrop-filter: blur(16px);

    position: sticky;

    top: 0;

    z-index: 100;
}


/* =========================================
   LOGO
========================================= */

.logo {

    font-size: 25px;

    font-weight: 900;

    color: #F8FAFC;

    white-space: nowrap;

    letter-spacing: 0.5px;
}

.logo span {
    color: #22D3EE;
}


/* =========================================
   NAV
========================================= */

nav {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    flex-wrap: wrap;
}

nav a {

    color: #CBD5E1;

    padding: 9px 12px;

    border-radius: 11px;

    font-size: 14px;

    transition: 0.25s;

    white-space: nowrap;
}

nav a:hover {

    background: #1E293B;

    color: #22D3EE;

    transform: translateY(-1px);
}

nav a.active {

    background:
        rgba(124, 58, 237, 0.16);

    color: #C4B5FD;

    border:
        1px solid rgba(124, 58, 237, 0.2);
}


/* =========================================
   PROFILE BUTTON
========================================= */

.profile {

    background: #7C3AED;

    color: #F8FAFC;

    padding: 10px 16px;

    border-radius: 12px;

    font-weight: bold;

    font-size: 13px;

    white-space: nowrap;

    transition: 0.25s;
}

.profile:hover {

    background: #6D28D9;

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(124, 58, 237, 0.25);
}


/* =========================================
   PAGE
========================================= */

.leaderboard-page {

    width: 100%;

    max-width: 1150px;

    margin: auto;

    padding: 55px 20px 80px;
}


/* =========================================
   HEADER TITLE
========================================= */

.leaderboard-header {

    text-align: center;

    margin-bottom: 48px;
}

.title-badge {

    display: inline-block;

    padding: 9px 18px;

    border-radius: 50px;

    background:
        rgba(124, 58, 237, 0.14);

    border:
        1px solid rgba(124, 58, 237, 0.3);

    color: #22D3EE;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 16px;

    box-shadow:
        0 0 25px rgba(34, 211, 238, 0.05);
}

.leaderboard-header h1 {

    font-size: 45px;

    line-height: 1.2;

    margin-bottom: 13px;
}

.leaderboard-header p {

    color: #94A3B8;

    font-size: 16px;

    line-height: 1.7;
}


/* =========================================
   TOP THREE
========================================= */

.top-three {

    width: 100%;

    max-width: 1000px;

    margin: 0 auto 50px;

    display: grid;

    grid-template-columns:
        1fr 1.15fr 1fr;

    gap: 18px;

    align-items: end;
}


/* =========================================
   TOP CARD
========================================= */

.top-card {

    background:
        linear-gradient(
            145deg,
            #1E293B,
            #172033
        );

    border:
        1px solid #334155;

    border-radius: 25px;

    padding: 26px 18px;

    text-align: center;

    position: relative;

    overflow: hidden;

    transition: 0.3s;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
}

.top-card::before {

    content: "";

    position: absolute;

    width: 140px;

    height: 140px;

    border-radius: 50%;

    background:
        rgba(124, 58, 237, 0.08);

    top: -70px;

    right: -50px;

    pointer-events: none;
}

.top-card:hover {

    transform:
        translateY(-8px);

    border-color:
        rgba(124, 58, 237, 0.5);
}


/* =========================================
   FIRST
========================================= */

.top-card.first {

    padding-top: 40px;

    padding-bottom: 40px;

    border:
        2px solid #7C3AED;

    background:
        linear-gradient(
            145deg,
            rgba(124, 58, 237, 0.28),
            #1E293B
        );

    box-shadow:
        0 0 45px
        rgba(124, 58, 237, 0.20);
}


/* =========================================
   SECOND
========================================= */

.top-card.second {

    border-color:
        rgba(148, 163, 184, 0.35);
}


/* =========================================
   THIRD
========================================= */

.top-card.third {

    border-color:
        rgba(180, 83, 9, 0.40);
}


/* =========================================
   CURRENT PLAYER
========================================= */

.top-card.current-player {

    border-color: #22D3EE;

    box-shadow:
        0 0 35px
        rgba(34, 211, 238, 0.14);
}


/* =========================================
   RANK MEDAL
========================================= */

.rank-medal {

    font-size: 48px;

    line-height: 1;

    margin-bottom: 14px;

    filter:
        drop-shadow(
            0 5px 8px rgba(0, 0, 0, 0.25)
        );
}


/* =========================================
   AVATAR
========================================= */

.avatar {

    width: 78px;

    height: 78px;

    border-radius: 50%;

    margin: auto auto 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #0F172A;

    border:
        2px solid #7C3AED;

    font-size: 34px;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.20);
}

.first .avatar {

    width: 92px;

    height: 92px;

    font-size: 42px;

    border-color: #22D3EE;

    box-shadow:
        0 0 25px
        rgba(34, 211, 238, 0.15);
}


/* =========================================
   PLAYER NAME
========================================= */

.top-card h2 {

    font-size: 20px;

    margin-bottom: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================
   CURRENT LABEL
========================================= */

.you-label {

    display: inline-block;

    margin-bottom: 10px;

    padding: 5px 10px;

    border-radius: 8px;

    background:
        rgba(34, 211, 238, 0.10);

    color: #22D3EE;

    font-size: 11px;

    font-weight: bold;
}


/* =========================================
   SCORE
========================================= */

.big-score {

    color: #22D3EE;

    font-size: 25px;

    font-weight: 900;

    margin-bottom: 11px;
}


/* =========================================
   LEVEL
========================================= */

.level {

    display: inline-block;

    background:
        rgba(124, 58, 237, 0.15);

    color: #C4B5FD;

    padding: 6px 11px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: bold;
}


/* =========================================
   XP
========================================= */

.xp {

    margin-top: 13px;

    color: #CBD5E1;

    font-size: 13px;
}


/* =========================================
   XP BAR
========================================= */

.xp-bar {

    width: 100%;

    height: 7px;

    margin-top: 8px;

    background: #334155;

    border-radius: 20px;

    overflow: hidden;
}

.xp-progress {

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #7C3AED,
            #22D3EE
        );

    border-radius: 20px;

    transition: width 0.5s ease;
}


/* =========================================
   CARD STATS
========================================= */

.card-stats {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 16px;
}

.card-stat {

    background: #0F172A;

    border:
        1px solid rgba(255, 255, 255, 0.04);

    border-radius: 12px;

    padding: 9px 5px;

    font-size: 12px;

    color: #94A3B8;
}

.card-stat strong {

    display: block;

    color: #F8FAFC;

    margin-top: 4px;

    font-size: 14px;
}


/* =========================================
   LEADERBOARD BOX
========================================= */

.leaderboard-box {

    background:
        rgba(17, 28, 49, 0.95);

    border:
        1px solid rgba(255, 255, 255, 0.06);

    border-radius: 25px;

    padding: 20px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);
}


/* =========================================
   TITLE
========================================= */

.leaderboard-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    padding: 8px 8px 20px;

    border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
}

.leaderboard-title h2 {

    font-size: 22px;
}

.leaderboard-title span {

    color: #94A3B8;

    font-size: 13px;
}


/* =========================================
   TABLE HEADER
========================================= */

.table-header {

    display: grid;

    grid-template-columns:
        65px 1fr 120px 110px 100px;

    gap: 12px;

    padding: 15px 12px;

    color: #64748B;

    font-size: 12px;

    font-weight: bold;
}


/* =========================================
   PLAYER ROW
========================================= */

.player-row {

    display: grid;

    grid-template-columns:
        65px 1fr 120px 110px 100px;

    gap: 12px;

    align-items: center;

    padding: 15px 12px;

    border-bottom:
        1px solid rgba(255, 255, 255, 0.05);

    transition:
        background 0.2s,
        transform 0.2s,
        border-color 0.2s;

    border-radius: 14px;
}

.player-row:hover {

    background:
        rgba(124, 58, 237, 0.08);

    transform:
        translateX(-2px);
}

.player-row:last-child {

    border-bottom:
        none;
}


/* =========================================
   CURRENT PLAYER ROW
========================================= */

.player-row.current-user {

    background:
        rgba(34, 211, 238, 0.07);

    border:
        1px solid
        rgba(34, 211, 238, 0.20);

    margin:
        4px 0;
}

.player-row.current-user:hover {

    background:
        rgba(34, 211, 238, 0.10);
}


/* =========================================
   RANK BOX
========================================= */

.rank-box {

    width: 44px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #1E293B;

    border:
        1px solid rgba(255, 255, 255, 0.04);

    border-radius: 13px;

    font-weight: bold;

    font-size: 16px;
}


/* =========================================
   TOP RANK BOXES
========================================= */

.player-row:nth-child(1) .rank-box {

    background:
        rgba(124, 58, 237, 0.18);

    color: #C4B5FD;
}

.player-row:nth-child(2) .rank-box {

    background:
        rgba(148, 163, 184, 0.12);

    color: #CBD5E1;
}

.player-row:nth-child(3) .rank-box {

    background:
        rgba(180, 83, 9, 0.12);

    color: #FDBA74;
}


/* =========================================
   PLAYER
========================================= */

.player {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}

.small-avatar {

    width: 43px;

    height: 43px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #1E293B;

    border:
        1px solid rgba(255, 255, 255, 0.04);

    font-size: 20px;

    flex-shrink: 0;
}

.player-name {

    font-weight: bold;

    color: #F8FAFC;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.badges {

    margin-top: 4px;

    color: #94A3B8;

    font-size: 11px;
}


/* =========================================
   VALUES
========================================= */

.score {

    color: #22D3EE;

    font-weight: bold;
}

.level-value {

    color: #A78BFA;

    font-weight: bold;
}

.xp-value {

    color: #F8FAFC;

    font-weight: bold;
}

.combo {

    color: #F59E0B;

    font-weight: bold;
}


/* =========================================
   EMPTY / LOADING
========================================= */

.message {

    text-align: center;

    padding: 55px 20px;

    color: #94A3B8;

    line-height: 1.9;

    font-size: 15px;
}

.message-icon {

    font-size: 45px;

    display: block;

    margin-bottom: 15px;
}


/* =========================================
   LOADING ANIMATION
========================================= */

.loading-dot {

    display: inline-block;

    animation:
        loadingDots 1.2s infinite;
}

@keyframes loadingDots {

    0%,
    100% {
        opacity: 0.3;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================
   BACK BUTTON
========================================= */

.back-home {

    display: block;

    width: fit-content;

    margin: 30px auto 0;

    padding: 13px 24px;

    background: #7C3AED;

    border-radius: 14px;

    font-weight: bold;

    transition: 0.25s;

    box-shadow:
        0 8px 20px
        rgba(124, 58, 237, 0.12);
}

.back-home:hover {

    background: #6D28D9;

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 25px
        rgba(124, 58, 237, 0.20);
}


/* =========================================
   FOOTER
========================================= */

footer {

    text-align: center;

    padding: 25px;

    border-top:
        1px solid rgba(255, 255, 255, 0.06);

    color: #64748B;

    font-size: 13px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    header {

        flex-direction: column;

        gap: 12px;

        padding: 15px 20px;
    }

    nav {

        width: 100%;

        gap: 5px;
    }

    nav a {

        font-size: 13px;

        padding: 8px 10px;
    }

    .profile {

        padding:
            9px 15px;
    }


    .leaderboard-page {

        padding:
            40px 12px 60px;
    }


    .leaderboard-header {

        margin-bottom: 35px;
    }


    .leaderboard-header h1 {

        font-size: 34px;
    }


    .leaderboard-header p {

        font-size: 14px;
    }


    .top-three {

        grid-template-columns: 1fr;

        max-width: 430px;

        gap: 15px;
    }


    .top-card.first {

        order: -1;
    }


    .top-card {

        padding:
            25px 18px;
    }


    .top-card.first {

        padding:
            32px 18px;
    }


    .table-header {

        display: none;
    }


    .leaderboard-box {

        padding: 13px;

        border-radius: 20px;
    }


    .leaderboard-title {

        padding:
            8px 5px 16px;
    }


    .leaderboard-title h2 {

        font-size: 18px;
    }


    .leaderboard-title span {

        font-size: 11px;
    }


    .player-row {

        grid-template-columns:
            45px 1fr 80px;

        gap: 8px;

        padding: 13px 6px;
    }


    .level-value,
    .xp-value,
    .combo {

        display: none;
    }


    .score {

        text-align: left;

        font-size: 13px;
    }


    .small-avatar {

        width: 40px;

        height: 40px;

        font-size: 18px;
    }


    .player {

        gap: 9px;
    }


    .player-name {

        font-size: 13px;
    }


    .badges {

        font-size: 10px;
    }


    .rank-box {

        width: 40px;

        height: 40px;

        font-size: 14px;
    }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 450px) {

    .logo {

        font-size: 22px;
    }

    nav a {

        font-size: 12px;

        padding:
            7px 8px;
    }

    .leaderboard-header h1 {

        font-size: 29px;
    }

    .title-badge {

        font-size: 12px;

        padding:
            8px 14px;
    }

    .big-score {

        font-size: 22px;
    }

    .leaderboard-title span {

        display: none;
    }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
    }
}

</style>

</head>

<!-- =========================================
     FIREBASE

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>



<script>

/* =========================================
   ELEMENTS
========================================= */

const topThree =
    document.getElementById("topThree");

const list =
    document.getElementById("leaderboardList");


/* =========================================
   MEDALS
========================================= */

const medals = [
    "🥇",
    "🥈",
    "🥉"
];


/* =========================================
   CURRENT USER
========================================= */

let currentUserUID = null;


/* =========================================
   GET CURRENT USER
========================================= */

if (
    typeof firebase !== "undefined" &&
    firebase.auth
) {

    firebase.auth().onAuthStateChanged(
        function(user) {

            if (user) {

                currentUserUID =
                    user.uid;

            } else {

                currentUserUID = null;

            }

            loadLeaderboard();

        }
    );

} else {

    loadLeaderboard();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    return String(text ?? "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =========================================
   GET LEVEL
========================================= */

function getLevel(xp) {

    return Math.floor(
        Number(xp || 0) / 100
    ) + 1;
}


/* =========================================
   GET CURRENT LEVEL XP
========================================= */

function getCurrentXP(xp) {

    return (
        Number(xp || 0) % 100
    );
}


/* =========================================
   GET BADGES
========================================= */

function getBadgeCount(player) {

    let count = 0;


    if (player.games >= 1)
        count++;


    if (player.games >= 10)
        count++;


    if (player.combo >= 5)
        count++;


    if (player.combo >= 10)
        count++;


    if (player.score >= 1000)
        count++;


    if (player.score >= 5000)
        count++;


    if (player.xp >= 400)
        count++;


    return count;
}


/* =========================================
   CHECK CURRENT PLAYER
========================================= */

function isCurrentPlayer(player) {

    return (
        currentUserUID &&
        player.uid === currentUserUID
    );
}


/* =========================================
   CREATE TOP CARD
========================================= */

function createTopCard(
    player,
    index
) {

    const level =
        getLevel(player.xp);


    const currentXP =
        getCurrentXP(player.xp);


    const badgeCount =
        getBadgeCount(player);


    const card =
        document.createElement("div");


    card.className =
        "top-card " +
        (
            index === 0
                ? "first"
                : index === 1
                    ? "second"
                    : "third"
        );


    if (isCurrentPlayer(player)) {

        card.classList.add(
            "current-player"
        );

    }


    const currentLabel =
        isCurrentPlayer(player)
            ? `
                <div class="you-label">
                    👤 أنت
                </div>
              `
            : "";


    card.innerHTML = `

        <div class="rank-medal">
            ${medals[index]}
        </div>


        <div class="avatar">
            🎮
        </div>


        ${currentLabel}


        <h2>
            ${escapeHTML(player.name)}
        </h2>


        <div class="big-score">
            ⭐ ${player.score.toLocaleString("en-US")}
        </div>


        <div class="level">
            ⭐ المستوى ${level}
        </div>


        <div class="xp">
            ⚡ ${player.xp.toLocaleString("en-US")} XP
        </div>


        <div class="xp-bar">

            <div
                class="xp-progress"
                style="width:${currentXP}%"
            ></div>

        </div>


        <div class="card-stats">


            <div class="card-stat">

                🏅 الشارات

                <strong>
                    ${badgeCount}
                </strong>

            </div>


            <div class="card-stat">

                🔥 Combo

                <strong>
                    ${player.combo}
                </strong>

            </div>


        </div>

    `;


    return card;
}


/* =========================================
   LOAD LEADERBOARD
========================================= */

async function loadLeaderboard() {

    try {

        /* =====================================
           GET SCORES
        ====================================== */

        const snapshot =
            await db
                .collection("scores")
                .get();


        const playerMap = {};


        /* =====================================
           GROUP BY USER
        ====================================== */

        snapshot.forEach(
            function(doc) {

                const data =
                    doc.data();

                 // استبعاد مكافأة التحدي اليومي من المتصدرين
                 if (data.category === "daily_reward") {
                 return;
}
                const uid =
                    data.uid;


                if (!uid)
                    return;


                if (!playerMap[uid]) {

                    playerMap[uid] = {

                        uid: uid,

                        name:
                            data.name ||
                            "لاعب",

                        score: 0,

                        xp: 0,

                        combo: 0,

                        games: 0

                    };

                }


                playerMap[uid].score +=
                    Number(data.score) || 0;


                playerMap[uid].xp +=
                    Number(data.xp) || 0;


                playerMap[uid].combo =
                    Math.max(
                        playerMap[uid].combo,

                        Number(
                            data.maxCombo
                        ) || 0
                    );


                playerMap[uid].games++;

            }
        );


        /* =====================================
           PLAYERS ARRAY
        ====================================== */

        const players =
            Object.values(playerMap);


        /* =====================================
           SORT
        ====================================== */

        players.sort(
            function(a, b) {

                /* النقاط */

                if (
                    b.score !==
                    a.score
                ) {

                    return (
                        b.score -
                        a.score
                    );

                }


                /* XP */

                if (
                    b.xp !==
                    a.xp
                ) {

                    return (
                        b.xp -
                        a.xp
                    );

                }


                /* COMBO */

                if (
                    b.combo !==
                    a.combo
                ) {

                    return (
                        b.combo -
                        a.combo
                    );

                }


                /* الألعاب */

                return (
                    b.games -
                    a.games
                );

            }
        );


        /* =====================================
           TOP 20
        ====================================== */

        const topPlayers =
            players.slice(0, 20);


        /* =====================================
           EMPTY
        ====================================== */

        if (
            topPlayers.length === 0
        ) {

            topThree.innerHTML = "";


            list.innerHTML = `

                <div class="message">

                    <span class="message-icon">
                        🏆
                    </span>

                    لسه مفيش لاعبين.

                    <br>

                    ابدأ أول تحدي
                    وخليك أول المتصدرين 🔥

                </div>

            `;

            return;
        }


        /* =====================================
           TOP THREE
        ====================================== */

        topThree.innerHTML = "";


        topPlayers
            .slice(0, 3)
            .forEach(
                function(
                    player,
                    index
                ) {

                    topThree.appendChild(
                        createTopCard(
                            player,
                            index
                        )
                    );

                }
            );


        /* =====================================
           LIST
        ====================================== */

        list.innerHTML = "";


        topPlayers.forEach(
            function(
                player,
                index
            ) {

                const rank =
                    index + 1;


                const level =
                    getLevel(player.xp);


                const badgeCount =
                    getBadgeCount(player);


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "player-row";


                if (
                    isCurrentPlayer(player)
                ) {

                    row.classList.add(
                        "current-user"
                    );

                }


                const rankDisplay =
                    rank <= 3
                        ? medals[rank - 1]
                        : rank;


                const youText =
                    isCurrentPlayer(player)
                        ? " • أنت"
                        : "";


                row.innerHTML = `

                    <div class="rank-box">

                        ${rankDisplay}

                    </div>


                    <div class="player">

                        <div class="small-avatar">
                            🎮
                        </div>


                        <div>

                            <div class="player-name">

                                ${escapeHTML(
                                    player.name
                                )}

                                ${youText}

                            </div>


                            <div class="badges">

                                🏅 ${badgeCount}
                                شارات

                                •

                                🎮 ${player.games}
                                ألعاب

                            </div>

                        </div>

                    </div>


                    <div class="score">

                        ⭐
                        ${player.score.toLocaleString("en-US")}

                    </div>


                    <div class="level-value">

                        ⭐ ${level}

                    </div>


                    <div class="combo">

                        🔥 ${player.combo}

                    </div>

                `;


                list.appendChild(row);

            }
        );


    }

    catch(error) {

        console.error(
            "Leaderboard Error:",
            error
        );


        topThree.innerHTML = "";


        list.innerHTML = `

            <div class="message">

                <span class="message-icon">
                    ❌
                </span>

                حصل خطأ أثناء تحميل
                المتصدرين.

                <br>

                تأكد إن Firebase متصل
                وإن قواعد Firestore صحيحة.

            </div>

        `;

    }

}


/* =========================================
   REAL-TIME UPDATE
========================================= */

if (
    typeof db !== "undefined"
) {

    db.collection("scores")
        .onSnapshot(
            function() {

                loadLeaderboard();

            },
            function(error) {

                console.error(
                    "Realtime Leaderboard Error:",
                    error
                );

            }
        );

}

</script>
